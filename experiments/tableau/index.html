<!doctype html>
<!-- tableau: frozen-moment 3D hook in the style of VN history explainers. 1280x720, captured by shoot.mjs -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #000; }
  canvas { display: block; }

  /* title card (shot E): grunge red text over a dark red glow */
  #title {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: radial-gradient(ellipse 62% 48% at 50% 54%, rgba(120, 8, 8, .55), rgba(24, 2, 2, .0) 70%);
    flex-direction: column; text-align: center;
  }
  #title .line {
    font-family: Georgia, 'Times New Roman', serif; font-weight: 700; letter-spacing: 4px;
    font-size: 58px; line-height: 1.25; color: #e8d9cf; text-transform: uppercase;
    text-shadow: 0 0 6px #ff2a1a, 0 0 22px #b01205, 0 0 60px #7a0c02, 0 2px 2px #000;
  }
  #title .line b { color: #ffe9df; }
</style>
</head>
<body>
<div id="stage">
  <div id="title">
    <div class="line">Vì sao xảy ra</div>
    <div class="line"><b>sự kiện Thiên An Môn?</b></div>
  </div>
</div>
<script type="module" src="bundle.js"></script>
</body>
</html>
